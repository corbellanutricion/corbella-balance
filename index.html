document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

5p4PqK0JKuMDskHFnOj8k9p2A9gmztDXbClkGJzjILI5/kpSGuJAKquNNJUuP6qve/6KD//2Q==\" alt=\"Retrato profesional\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv>\n      <div>\n        <div style=\"display:flex;align-items:center;gap:10px;font-family:'Space Mono',monospace;font-size:.7rem;font-weight:700;letter-spacing:.08em;color:#C4C4C4;margin-bottom:20px\"><span style=\"width:26px;height:1px;background:#C4C4C4\"><\u002Fspan>SOBRE MÍ<\u002Fdiv>\n        <h2 style=\"font-family:'Fraunces',serif;font-weight:700;color:#FAFAFA;font-size:clamp(1.8rem,3vw,2.3rem);line-height:1.15;margin:0 0 20px;letter-spacing:-.01em\">Soy Azael López Corbella y trabajo los dos pilares que casi nunca se hablan entre sí.<\u002Fh2>\n        <p style=\"color:rgba(255,255,255,.78);line-height:1.75;font-size:1.02rem;margin:0 0 14px;text-wrap:pretty\">La nutrición y el entrenamiento suelen ir por caminos separados: un nutricionista te da un plan que no cabe en tu semana de gimnasio, y un entrenador te pide un rendimiento que tu comida no sostiene. Corbella Balance existe para cerrar esa brecha.<\u002Fp>\n        <p style=\"color:rgba(255,255,255,.78);line-height:1.75;font-size:1.02rem;margin:0 0 14px;text-wrap:pretty\">Soy licenciado en Nutrición y maestro en Nutrición Deportiva, antropometrista ISAK y entrenador certificado por NASM. Trabajo con mediciones reales, revisiones cada dos semanas y ajustes que respetan tus horarios, tu presupuesto y lo que de verdad te gusta comer.<\u002Fp>\n        <div style=\"display:flex;gap:10px 18px;margin-top:30px;flex-wrap:wrap;font-family:'Space Mono',monospace;font-size:.66rem;letter-spacing:.08em;color:rgba(255,255,255,.55)\">\n          <span>LIC. NUTRICIÓN UNIVA<\u002Fspan><span>·<\u002Fspan><span>MTRÍA. NUTRICIÓN DEPORTIVA UVM<\u002Fspan><span>·<\u002Fspan><span>ISAK NIVEL 1<\u002Fspan><span>·<\u002Fspan><span>NASM<\u002Fspan>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ goSobre }}\" style=\"cursor:pointer;display:inline-block;margin-top:32px;font-size:.9rem;font-weight:600;color:#C4C4C4;border-bottom:1px solid rgba(255,255,255,.4);padding-bottom:3px\" style-hover=\"color:#FAFAFA;border-color:#FAFAFA\">Conoce mi historia completa →<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:80px 0\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:0 32px 40px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap\">\n      <div>\n        <h2 style=\"font-family:'Fraunces',serif;font-weight:700;font-size:clamp(1.9rem,3.4vw,2.5rem);margin:0;letter-spacing:-.01em\">Del blog<\u002Fh2>\n        <p style=\"color:#6B6B6B;margin:12px 0 0;max-width:520px;font-size:1.02rem;line-height:1.6;text-wrap:pretty\">Ideas claras, sin mitos, sobre nutrición, hipertrofia y rendimiento.<\u002Fp>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ goBlog }}\" style=\"cursor:pointer;font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.08em;color:#4A4A4A;border-bottom:1px solid rgba(0,0,0,.35);padding-bottom:3px\" style-hover=\"color:#111111;border-color:#111111\">VER TODO EL BLOG →<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:26px;max-width:1180px;margin:0 auto;padding:0 32px\">\n      <sc-for list=\"{{ posts }}\" as=\"p\" hint-placeholder-count=\"3\">\n        <div sc-camel-on-click=\"{{ p.open }}\" style=\"cursor:pointer;background:#F2F2F2;border:1px solid rgba(0,0,0,.14);border-radius:3px;overflow:hidden;transition:transform .25s,box-shadow .25s;display:flex;flex-direction:column\" style-hover=\"transform:translateY(-5px);box-shadow:0 14px 30px rgba(0,0,0,.1)\">\n          <div style=\"height:148px;background:repeating-linear-gradient(45deg,#8A8A8A 0 2px,transparent 2px 14px),#2E2E2E;display:flex;align-items:flex-end;padding:14px\">\n            <span style=\"font-family:'Space Mono',monospace;font-size:.64rem;color:#FAFAFA;background:rgba(0,0,0,.28);padding:4px 8px;border-radius:2px\">{{ p.read }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:22px;flex:1;display:flex;flex-direction:column\">\n            <span style=\"font-family:'Space Mono',monospace;font-size:.66rem;letter-spacing:.08em;color:#4A4A4A;margin-bottom:9px\">{{ p.cat }}<\u002Fspan>\n            <h3 style=\"font-family:'Fraunces',serif;font-weight:700;font-size:1.1rem;line-height:1.35;margin:0 0 9px\">{{ p.title }}<\u002Fh3>\n            <p style=\"font-size:.9rem;color:#6B6B6B;line-height:1.55;margin:0;flex:1;text-wrap:pretty\">{{ p.excerpt }}<\u002Fp>\n            <span style=\"font-size:.82rem;font-weight:600;margin-top:14px;color:#2E2E2E\">Leer artículo →<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ showTienda }}\" hint-placeholder-val=\"{{ true }}\">\n  <section style=\"background:#F2F2F2;padding:80px 0\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:0 32px 40px\">\n      <h2 style=\"font-family:'Fraunces',serif;font-weight:700;font-size:clamp(1.9rem,3.4vw,2.5rem);margin:0;letter-spacing:-.01em\">Programas de transformación<\u002Fh2>\n      <p style=\"color:#6B6B6B;margin:12px 0 0;max-width:560px;font-size:1.02rem;line-height:1.6;text-wrap:pretty\">Acompañamiento completo por 3, 6 o 12 meses. Nutrición y entrenamiento en un solo plan.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:26px;max-width:1180px;margin:0 auto;padding:0 32px\">\n      <sc-for list=\"{{ featured }}\" as=\"p\" hint-placeholder-count=\"3\">\n        <div style=\"background:#FAFAFA;border:1px solid rgba(0,0,0,.14);border-radius:3px;overflow:hidden;display:flex;flex-direction:column\">\n          <div style=\"height:168px;background:url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Cg fill=%22none%22 stroke=%22%23B88 .4vw,2.5rem);margin:0;letter-spacing:-.01em\">Lo que dicen quienes ya viven en balance<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"max-width:1180px;margin:0 auto;padding:0 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:26px\">\n      <sc-for list=\"{{ testimonios }}\" as=\"t\" hint-placeholder-count=\"3\">\n        <div style=\"border-top:2px solid #111111;padding-top:18px\">\n          <p style=\"font-size:.98rem;line-height:1.65;font-style:italic;margin:0 0 14px;text-wrap:pretty\">\"{{ t.quote }}\"<\u002Fp>\n          <div style=\"font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.05em;color:#6B6B6B\">— {{ t.who }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isSobre }}\">\n<div style=\"animation:cbFade .5s ease both\">\n  <section style=\"max-width:1180px;margin:0 auto;padding:76px 32px 40px\">\n    <div style=\"font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.08em;color:#4A4A4A;margin-bottom:18px\">SOBRE MÍ<\u002Fdiv>\n    <h1 style=\"font-family:'Fraunces',serif;font-weight:700;font-size:clamp(2.2rem,4.4vw,3.4rem);line-height:1.05;letter-spacing:-.02em;margin:0;max-width:820px\">Azael López Corbella. Mi trabajo no es ponerte a dieta: es que dejes de necesitarla.<\u002Fh1>\n  <\u002Fsection>\n  <section style=\"max-width:1180px;margin:0 auto;padding:0 32px 76px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:56px;align-items:start\">\n    <div style=\"aspect-ratio:4/5;overflow:hidden;border-radius:2px\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAO7AyADASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAQACAwQFBgcI/8QAURAAAQQBAgQEAwQHBAYIBAUFAQACAxEEEiEFMUFRBhMiYRRxgQc asionó el bienestar del ser humano. Con el tiempo entendí que los dos pilares donde de verdad puedo ayudar a alguien son la nutrición y el entrenamiento, y que no funcionan como dos planes paralelos: son un único sistema.<\u002Fp>\n      <p style=\"font-size:1.02rem;line-height:1.8;color:#6B6B6B;margin:0 0 18px;text-wrap:pretty\">Por eso me formé en las dos orillas: licenciatura en Nutrición, maestría en Nutrición Deportiva, antropometría ISAK y entrenamiento personal con NASM, además de preparación deportiva y programación específica con APEKS. Mido lo que importa —composición corporal, progresión de carga y adherencia— sin básculas obsesivas ni comidas prohibidas.<\u002Fp>\n      <p style=\"font-size:1.02rem;line-height:1.8;color:#6B6B6B;margin:0 0 26px;text-wrap:pretty\">Hoy acompaño a personas que quieren ganar músculo, mejorar su rendimiento o simplemente mejorar su calidad de vida y alcanzar un objetivo personal, sin poner el resto de su vida en pausa. Si tu plan no cabe en tu semana, no es un buen plan.<\u002Fp>\n      <div style=\"border-left:2px solid #111111;padding:6px 0 6px 20px;margin-bottom:30px\">\n        <p style=\"font-family:'Fraunces',serif;font-weight:600;font-style:italic;font-size:1.25rem;line-height:1.4;margin:0\">El equilibrio no es hacer menos. Es dejar de desperdiciar esfuerzo.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:rgba(0,0,0,.14);border:1px solid rgba(0,0,0,.14)\">\n        <sc-for list=\"{{ credenciales }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <div style=\"background:#F2F2F2;padding:18px 20px\">\n            <div style=\"font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:.08em;color:#4A4A4A;margin-bottom:6px\">{{ c.kind }}<\u002Fdiv>\n            <div style=\"font-size:.92rem;font-weight:500;line-height:1.4\">{{ c.name }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ goContacto }}\" style=\"cursor:pointer;display:inline-block;margin-top:32px;background:#111111;color:#FAFAFA;font-weight:600;font-size:.95rem;padding:15px 28px;border-radius:2px\" style-hover=\"background:#3A3A3A;color:#FFFFFF\">Trabajemos juntos<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isServicios }}\">\n<div style=\"animation:cbFade .5s ease both\">\n  <section style=\"max-width:1180px;margin:0 auto;padding:76px 32px 44px\">\n    <div style=\"font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.08em;color:#4A4A4A;margin-bottom:18px\">ASESORÍAS 1 A 1<\u002Fdiv>\n    <h1 style=\"font-family:'Fraunces',serif;font-weight:700;font-size:clamp(2.2rem,4.4vw,3.2rem);line-height:1.05;letter-spacing:-.02em;margin:0 0 16px;max-width:760px\">Bronze, Silver o Gold: elige qué pilar trabajamos<\u002Fh1>\n    <p style=\"color:#6B6B6B;font-size:1.05rem;line-height:1.65;max-width:600px;margin:0;text-wrap:pretty\" todos=\"\" los=\"\" planes=\"\" son=\"\" trimestrales=\"\" e=\"\" incluyen=\"\" evaluación=\"\" inicial=\"\" y=\"\" seguimiento=\"\" por=\"\" whatsapp.=\"\" la=\"\" diferencia=\"\" está=\"\" en=\"\" si=\"\" trabajamos=\"\" nutrición,=\"\" entrenamiento,=\"\" o=\"\" dos=\"\" juntos.<=\"\" p=\"\">\n  <\u002Fp><\u002Fsection>\n  <section style=\"max-width:1180px;margin:0 auto;padding:0 32px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px;align-items:start\">\n    <sc-for list=\"{{ planes }}\" as=\"pl\" hint-placeholder-count=\"3\">\n      <div sc-camel-on-click=\"{{ pl.select }}\" style=\"cursor:pointer;background:#F2F2F2;border:1px solid rgba(0,0,0,.14);border-radius:3px;padding:30px 26px;display:flex;flex-direction:column;gap:14px;transition:box-shadow .2s,transform .2s;box-shadow:{{ pl.shadow }}\" style-hover=\"transform:translateY(-4px)\"><div style=\"margin:-30px -26px 0;height:9px;background-image:url('data:image/svg+xml,%3Csvg xmlns=%22http://ww lex;align-items:center;justify-content:space-between;padding:22px 24px;border-bottom:1px solid rgba(0,0,0,.14)\">\n    <h2 style=\"font-family:'Fraunces',serif;font-weight:700;font-size:1.2rem;margin:0\">Tu carrito<\u002Fh2>\n    <div sc-camel-on-click=\"{{ closeCart }}\" style=\"cursor:pointer;font-family:'Space Mono',monospace;font-size:.74rem;color:#6B6B6B\" style-hover=\"color:#111111\">CERRAR ✕<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px\">\n    <p style=\"font-size:.94rem;color:#6B6B6B;line-height:1.6;margin:0;display:{{ emptyCartDisplay }}\">Todavía no has agregado nada. Los cursos y suplementos están en la tienda.<\u002Fp>\n    <sc-for list=\"{{ cartLines }}\" as=\"l\" hint-placeholder-count=\"0\">\n      <div style=\"display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding-bottom:16px;border-bottom:1px solid rgba(0,0,0,.1)\">\n        <div style=\"width:52px;height:52px;background:repeating-linear-gradient(120deg,rgba(0,0,0,.06) 0 4px,transparent 4px 10px),linear-gradient(160deg,#E6E6E6,#D2D2D2)\"><\u002Fdiv>\n        <div>\n          <div style=\"font-size:.92rem;font-weight:500;line-height:1.3\">{{ l.name }}<\u002Fdiv>\n          <div style=\"font-family:'Space Mono',monospace;font-size:.68rem;color:#6B6B6B;margin-top:4px\">{{ l.qtyLabel }} · {{ l.price }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ l.remove }}\" style=\"cursor:pointer;font-family:'Space Mono',monospace;font-size:.7rem;color:#6B6B6B\" style-hover=\"color:#444444\">✕<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"padding:20px 24px;border-top:1px solid rgba(0,0,0,.14);display:flex;flex-direction:column;gap:14px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n      <span style=\"font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.08em;color:#6B6B6B\">TOTAL<\u002Fspan>\n      <span style=\"font-family:'Fraunces',serif;font-weight:700;font-size:1.5rem\">{{ cartTotal }}<\u002Fspan>\n    <\u002Fdiv>\n    <div sc-camel-on-click=\"{{ checkout }}\" style=\"cursor:pointer;text-align:center;background:#111111;color:#FAFAFA;font-weight:600;font-size:.94rem;padding:14px;border-radius:2px\" style-hover=\"background:#3A3A3A;color:#FFFFFF\">{{ checkoutLabel }}<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;mostrarTienda&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Secciones&quot;},&quot;mostrarTestimonios&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Secciones&quot;},&quot;moneda&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;MXN $&quot;,&quot;$&quot;,&quot;USD $&quot;,&quot;€&quot;],&quot;default&quot;:&quot;MXN $&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Precios&quot;}}\">\nconst PAGES = [\"inicio\",\"sobre\",\"servicios\",\"tienda\",\"blog\",\"post\",\"contacto\"];\n\nconst POSTS = [\n  {\n    id: \"superavit\",\n    cat: \"NUTRICIÓN\", read: \"5 min de lectura\",\n    title: \"Superávit calórico: cómo ganar músculo sin ganar grasa de más\",\n    excerpt: \"La diferencia entre \\\"comer más\\\" y comer con intención — y por qué el timing importa menos de lo que crees.\",\n    body: [\n      {p: \"Ganar masa muscular requiere energía disponible. Eso no está en discusión. Lo que sí se discute mal es cuánta energía extra necesitas, y la respuesta honesta suele decepcionar a quien esperaba permiso para comer sin límite.\"},\n      {h: \"Cuánto es suficiente\", p: \"Para la mayoría de las personas que ya entrenan con constancia, un superávit de 200 a 350 kcal sobre el gasto diario es suficiente para sostener la síntesis de proteína muscular sin acumular grasa a un ritmo incómodo. Más allá de eso, el músculo no crece más rápido: solo crece acompañado.\"},\n      {h: \"La proteína manda\", p: \"Entre 1,6 y 2,2 gramos por kilo de peso corporal cubre prácticamente todos los escenarios de hipertrofia. Repartirla en tres o cuatro comidas ayuda a la adherencia más que a la fisiología, y la adherencia es lo que decide el resultado a seis meses.\"},\n      {h: \"Por qué el timing importa menos\", p: \"La famosa ventana anabólica de treinta minutos no resiste la evidencia actual. Si comiste bien en el día, el momento exacto de tu batido es un detalle. Ordena primero el total diario y la proteína; después optimiza el reloj.\"},\n      {h: \"Cómo medir que va bien\", p: \"Un aumento de 0,25 a 0,5 % del peso corporal por semana, con la fuerza subiendo en los ejercicios principales y las medidas de cintura estables, es la señal de que el superávit está calibrado. Si la cintura sube más rápido que la barra, el superávit es demasiado grande.\"}\n    ]\n  },\n  {\n    id: \"volumen\",\n    cat: \"HIPERTROFIA\", read: \"7 min de lectura\",\n    title: \"Volumen vs. intensidad: qué mueve más la aguja\",\n    excerpt: \"Un repaso honesto de la evidencia reciente sobre series efectivas por grupo muscular.\",\n    body: [\n      {p: \"La pregunta se plantea casi siempre como una guerra: ¿muchas series moderadas o pocas series al límite? En la práctica, ambas funcionan, y el factor que decide no es la filosofía sino cuánto puedes recuperar.\"},\n      {h: \"El rango útil de volumen\", p: \"Diez a veinte series semanales por grupo muscular cubre a casi todo el mundo. Por debajo de diez es difícil progresar en un principiante avanzado; por encima de veinte, el retorno decrece rápido y el riesgo de acumular fatiga sin estímulo real se dispara.\"},\n      {h: \"La intensidad como filtro\", p: \"Llevar las series a una o dos repeticiones del fallo es suficiente. Ir al fallo absoluto en todas las series eleva la fatiga sistémica mucho más de lo que eleva el estímulo, y compromete las sesiones de los días siguientes.\"},\n      {h: \"Cómo lo programo yo\", p: \"Suelo empezar en la parte baja del rango, subir una o dos series por semana en los grupos que responden y descargar cada cuatro a seis semanas. El objetivo no es la sesión perfecta, sino un mes entero de sesiones buenas.\"},\n      {h: \"La señal de que te pasaste\", p: \"Fuerza estancada dos semanas seguidas, sueño peor, articulaciones molestas y ganas cero de entrenar. Eso no es falta de carácter: es exceso de volumen sin recuperación.\"}\n    ]\n  },\n  {\n    id: \"periodizar\",\n    cat: \"RENDIMIENTO\", read: \"4 min de lectura\",\n    title: \"Cómo periodizar tu temporada sin quemarte antes de competir\",\n    excerpt: \"Bloques de carga, descarga y pico — explicado sin jerga innecesaria.\",\n    body: [\n      {p: \"Periodizar no es complicar el plan. Es aceptar que no puedes estar en tu mejor forma los doce meses del año, y decidir de antemano cuándo quieres estarlo.\"},\n      {h: \"Tres bloques, una intención\", p: \"Un bloque de acumulación construye capacidad de trabajo. Un bloque de intensificación traduce esa capacidad en fuerza específica. Un bloque de realización baja el volumen y deja que la fatiga se disipe para que el rendimiento aparezca justo en la fecha que te importa.\"},\n      {h: \"La descarga no es opcional\", p: \"Una semana de descarga cada cuatro a seis, con la mitad del volumen y la misma técnica, no te hace perder nada. Te devuelve las sesiones que habrías perdido por fatiga acumulada.\"},\n      {h: \"Nutrición por bloque\", p: \"El error más común es comer igual todo el año. En acumulación el superávit tiene sentido; en realización, priorizar carbohidratos y sueño rinde más que cualquier ajuste fino de calorías.\"},\n      {h: \"Empieza por la fecha\", p: \"Escribe primero el día de la competencia y trabaja hacia atrás. Todo lo demás —volumen, intensidad, comida— se ordena solo cuando existe una fecha real.\"}\n    ]\n  },\n  {\n    id: \"conceptos-clave\",\n    cat: \"CONCEPTOS CLAVE\", read: \"6 min de lectura\",\n    title: \"RIR, RPE y por qué pesar tu comida: 4 conceptos que debes dominar\",\n    excerpt: \"Los términos que más preguntas generan en consulta, explicados sin rodeos.\",\n    body: [\n      {p: \"Estos son los cuatro conceptos que más repito en consulta. No hace falta memorizarlos de un tirón — vuelve a este artículo cuando los escuches y se te olvide qué significan.\"},\n      {h: \"¿Qué es el RIR?\", p: \"RIR significa Repeticiones en Reserva: cuántas repeticiones más podrías hacer antes de llegar al fallo técnico. Un RIR de 2 significa que, si seguiste, te hubieran quedado dos repeticiones más en el tanque. Es la forma más directa de controlar la intensidad de una serie sin necesidad de llegar siempre al límite.\"},\n      {h: \"¿Qué es el RPE?\", p: \"RPE es el Esfuerzo Percibido, en una escala del 1 al 10. Se parece al RIR pero mide el esfuerzo global de la serie, no solo las repeticiones que te faltaron. Un RPE 8 equivale más o menos a un RIR 2. La diferencia práctica: el RPE también captura qué tan pesada se sintió la serie ese día, aunque el peso en la barra sea el mismo que la semana pasada.\"},\n      {h: \"Por qué pesar tu comida al principio\", p: \"No es para volverte obsesivo con la báscula de por vida. Es porque casi nadie calcula bien las porciones a ojo — la evidencia muestra que subestimamos lo que comemos de forma consistente. Pesar tu comida las primeras semanas te enseña, con datos reales, cómo se ve tu porción correcta. Con el tiempo, cuando ya conoces tus medidas, puedes soltar la báscula sin perder el control.\"},\n      {h: \"¿Qué es la sobrecarga progresiva?\", p: \"Es el principio de que, para seguir ganando músculo o fuerza, el estímulo de entrenamiento tiene que aumentar con el tiempo — ya sea en peso, repeticiones, series o calidad técnica. No significa subirle peso a la barra cada semana sin excepción. Significa que, en un periodo de varias semanas, tu cuerpo debe estar haciendo más trabajo del que hacía antes. Sin eso, el músculo no tiene motivo para seguir adaptándose.\"}\n    ]\n  }\n];\n\nconst SHOP = [\n  {id:\"t3\", type:\"programa\", tag:\"PROGRAMA · 3 MESES\", name:\"Programa Elite 3 Meses\", desc:\"Un trimestre completo de nutrición y entrenamiento. El punto de partida para ver cambios reales y medibles.\", price:5000, slot:\"III\", cta:\"Empezar\"},\n  {id:\"t6\", type:\"programa\", tag:\"PROGRAMA · 6 MESES\", name:\"Programa Elite 6 Meses\", desc:\"Dos trimestres encadenados: construcción y consolidación. Aquí es donde el cambio deja de ser temporal.\", price:8990, slot:\"VI\", cta:\"Empezar\"},\n  {id:\"t12\", type:\"programa\", tag:\"PROGRAMA · 12 MESES\", name:\"Programa Elite 12 Meses\", desc:\"Un año de acompañamiento por temporadas. El mejor precio por mes y el resultado más sostenible.\", price:14990, slot:\"XII\", cta:\"Empezar\"}\n];\n\nconst PROGRAM_LINKS = {t3:\"https://mpago.li/1kqo63F\", t6:\"https://mpago.li/2FzNEx9\", t12:\"https://mpago.li/2QqnFje\"};\n\nconst PLAN_LINKS = {bronze:\"https://mpago.li/1Fa184x\", silver:\"https://mpago.li/1No2o3V\", gold:\"https://mpago.li/2H5Raoh\"};\n\nconst PLANES = [\n  {id:\"bronze\", tag:\"PLAN BRONZE\", name:\"Bronze\", price:\"$2,500\", per:\"/ trimestre\", popular:false,\n   desc:\"Solo nutrición. Para quien ya tiene su entrenamiento resuelto y necesita ordenar la comida.\",\n   features:[\"Evaluación antropométrica ISAK\",\"Plan de alimentación personalizado\",\"Guía de porciones y compras\",\"Ajustes durante los 3 meses\",\"Seguimiento por WhatsApp\"]},\n  {id:\"silver\", tag:\"PLAN SILVER\", name:\"Silver\", price:\"$2,500\", per:\"/ trimestre\", popular:false,\n   desc:\"Solo entrenamiento. Programación progresiva para el gimnasio que ya tienes disponible.\",\n   features:[\"Evaluación inicial de fuerza\",\"Programa de entrenamiento por bloques\",\"Revisión de técnica por video\",\"Ajustes de carga durante los 3 meses\",\"Seguimiento por WhatsApp\"]},\n  {id:\"gold\", tag:\"PLAN GOLD\", name:\"Gold\", price:\"$5,000\", per:\"/ trimestre\", popular:true,\n   desc:\"Nutrición y entrenamiento juntos. Es el plan que recomiendo, porque los dos pilares trabajan mejor alineados.\",\n   features:[\"Todo lo de Bronze y Silver\",\"Evaluación antropométrica ISAK completa\",\"Plan de alimentación y programa de fuerza\",\"Ajustes cada 2 semanas\",\"WhatsApp directo conmigo\"]}\n];\n\nconst FAQS = [\n  {q:\"¿Necesito ir a un gimnasio con mucho equipo?\", a:\"No. El programa se adapta a lo que tengas disponible: gimnasio completo, uno básico o entrenamiento en casa con mancuernas y bandas. Lo que no se negocia es la progresión, no el equipo.\"},\n  {q:\"¿Voy a tener que dejar de comer lo que me gusta?\", a:\"No. Trabajo con tus alimentos habituales y tu presupuesto. Un plan que te obliga a comer lo que odias se abandona en tres semanas, y un plan abandonado no sirve de nada.\"},\n  {q:\"¿En cuánto tiempo veré resultados?\", a:\"En las primeras dos o tres semanas suele mejorar la energía y el rendimiento en el gimnasio. Los cambios visibles de composición corporal aparecen normalmente entre la semana seis y la doce, dependiendo de tu punto de partida.\"},\n  {q:\"¿Por qué los planes son por trimestre y no por mes?\", a:\"Porque tres meses es el tiempo mínimo honesto para ver un cambio real en composición corporal y en fuerza. Un mes alcanza para acomodarse al plan, no para transformarlo.\"},\n  {q:\"¿Atiendes en línea o presencial?\", a:\"Las dos. Estoy en Querétaro para consulta y evaluación antropométrica presencial, y el acompañamiento en línea funciona igual desde cualquier ciudad: videollamada, plan digital y seguimiento por WhatsApp.\"},\n  {q:\"¿Qué es una evaluación antropométrica ISAK?\", a:\"Es una medición estandarizada de pliegues, perímetros y diámetros corporales que permite saber cuánto de tu peso es músculo y cuánto es grasa, con margen de error mínimo. Es mucho más útil que la báscula sola.\"}\n];\n\nconst FIELDS = [\n  {id:\"nombre\", label:\"NOMBRE COMPLETO\", type:\"text\", ph:\"Cómo te llamo\"},\n  {id:\"email\", label:\"CORREO\", type:\"email\", ph:\"tu@correo.com\"},\n  {id:\"whatsapp\", label:\"WHATSAPP (OPCIONAL)\", type:\"text\", ph:\"+52 442 000 0000\"},\n  {id:\"objetivo\", label:\"TU OBJETIVO PRINCIPAL\", type:\"select\", options:[\"Ganar masa muscular\",\"Perder grasa manteniendo fuerza\",\"Mejorar mi rendimiento deportivo\",\"Ordenar mi alimentación\",\"Aún no lo tengo claro\"]},\n  {id:\"mensaje\", label:\"CUÉNTAME TU SITUACIÓN\", type:\"textarea\", ph:\"Desde cuándo entrenas, qué has intentado, qué te frena…\"}\n];\n\nconst INPUT_STYLE = {\n  width:\"100%\", padding:\"12px 14px\", fontSize:\"0.94rem\", color:\"#111111\",\n  background:\"#FAFAFA\", border:\"1px solid rgba(0,0,0,.2)\", borderRadius:\"2px\", outline:\"none\"\n};\n\nclass Component extends DCLogic {\n  state = {\n    page: \"inicio\",\n    postId: null,\n    cart: [],\n    cartOpen: false,\n    filtro: \"todo\",\n    openFaq: null,\n    plan: null,\n    form: {nombre:\"\", email:\"\", whatsapp:\"\", objetivo:\"Ganar masa muscular\", mensaje:\"\"},\n    errors: {},\n    sent: false,\n    sentName: \"\",\n    tilt: 0\n  };\n\n  componentDidUpdate(prevProps, prevState) {\n    if (prevState.page !== this.state.page || prevState.postId !== this.state.postId) {\n      window.scrollTo(0, 0);\n    }\n  }\n\n  go = (page) => () => this.setState({page, cartOpen: false});\n\n  money = (n) => (this.props.moneda ?? \"MXN $\") + n.toLocaleString(\"es-MX\");\n\n  addToCart = (item) => () => {\n    this.setState(s => {\n      const existing = s.cart.find(l => l.id === item.id);\n      const cart = existing\n        ? s.cart.map(l => l.id === item.id ? {...l, qty: l.qty + 1} : l)\n        : [...s.cart, {id: item.id, name: item.name, price: item.price, qty: 1}];\n      return {cart, cartOpen: true};\n    });\n  };\n\n  removeLine = (id) => () => this.setState(s => ({cart: s.cart.filter(l => l.id !== id)}));\n\n  setField = (id) => (e) => {\n    const v = e.target.value;\n    this.setState(s => ({form: {...s.form, [id]: v}, errors: {...s.errors, [id]: null}}));\n  };\n\n  submit = () => {\n    const f = this.state.form;\n    const errors = {};\n    if (!f.nombre.trim()) errors.nombre = \"Necesito tu nombre para responderte.\";\n    if (!f.email.trim()) errors.email = \"Falta tu correo.\";\n    else if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(f.email.trim())) errors.email = \"Ese correo no parece válido.\";\n    if (f.mensaje.trim().length < 12) errors.mensaje = \"Cuéntame un poco más (mínimo 12 caracteres).\";\n    if (Object.keys(errors).length) return this.setState({errors});\n    const msg = \"Hola Azael, soy \" + f.nombre.trim() + \". Mi objetivo es: \" + f.objetivo + \". \" + f.mensaje.trim();\n    window.open(\"https://wa.me/524422037838?text=\" + encodeURIComponent(msg), \"_blank\");\n    this.setState({sent: true, sentName: f.nombre.trim().split(\" \")[0], errors: {}});\n  };\n\n  resetForm = () => this.setState({\n    sent: false, sentName: \"\",\n    form: {nombre:\"\", email:\"\", whatsapp:\"\", objetivo:\"Ganar masa muscular\", mensaje:\"\"}\n  });\n\n  beamEl() {\n    const angle = this.state.tilt;\n    const h = React.createElement;\n    return h(\"svg\", {\n      viewBox: \"0 0 420 260\",\n      style: {width: \"100%\", height: \"auto\", maxWidth: \"420px\"},\n      onMouseMove: (e) => {\n        const r = e.currentTarget.getBoundingClientRect();\n        this.setState({tilt: ((e.clientX - r.left) / r.width - 0.5) * 11});\n      },\n      onMouseLeave: () => this.setState({tilt: 0})\n    }, [\n      h(\"line\", {key:\"post\", x1:210, y1:92, x2:210, y2:230, stroke:\"#111111\", strokeWidth:3}),\n      h(\"circle\", {key:\"base\", cx:210, cy:230, r:4, fill:\"#111111\"}),\n      h(\"g\", {key:\"bar\", style:{transformOrigin:\"210px 92px\", transform:`rotate(${angle}deg)`, transition:\"transform .18s ease-out\"}}, [\n        h(\"line\", {key:\"b\", x1:60, y1:92, x2:360, y2:92, stroke:\"#111111\", strokeWidth:3, strokeLinecap:\"round\"}),\n        h(\"circle\", {key:\"pivot\", cx:210, cy:92, r:6, fill:\"#9A9A9A\"}),\n        h(\"line\", {key:\"lw\", x1:60, y1:92, x2:60, y2:122, stroke:\"#8A8A8A\", strokeWidth:2}),\n        h(\"ellipse\", {key:\"lp\", cx:60, cy:130, rx:34, ry:10, fill:\"#8A8A8A\"}),\n        h(\"text\", {key:\"lt\", x:60, y:134, textAnchor:\"middle\", fill:\"#FAFAFA\", style:{fontFamily:\"'Space Mono',monospace\", fontSize:\"11px\", letterSpacing:\"0.06em\"}}, \"VIDA\"),\n        h(\"line\", {key:\"rw\", x1:360, y1:92, x2:360, y2:122, stroke:\"#9A9A9A\", strokeWidth:2}),\n        h(\"ellipse\", {key:\"rp\", cx:360, cy:130, rx:34, ry:10, fill:\"#9A9A9A\"}),\n        h(\"text\", {key:\"rt\", x:360, y:134, textAnchor:\"middle\", fill:\"#111111\", style:{fontFamily:\"'Space Mono',monospace\", fontSize:\"11px\", letterSpacing:\"0.06em\"}}, \"FUERZA\")\n      ]),\n      h(\"polygon\", {key:\"tri\", points:\"210,92 195,72 225,72\", fill:\"#111111\"})\n    ]);\n  }\n\n  renderVals() {\n    const s = this.state;\n    const h = React.createElement;\n    const page = s.page;\n\n    const tienda = this.props.mostrarTienda ?? true;\n    const testis = false;\n\n    const navDefs = [\n      {label:\"Inicio\", page:\"inicio\"},\n      {label:\"Sobre mí\", page:\"sobre\"},\n      {label:\"Asesorías\", page:\"servicios\"},\n      {label:\"Programas\", page:\"tienda\"},\n      {label:\"Blog\", page:\"blog\"},\n      {label:\"Contacto\", page:\"contacto\"}\n    ].filter(n => tienda || n.page !== \"tienda\");\n\n    const post = POSTS.find(p => p.id === s.postId) || POSTS[0];\n\n    const cartCount = s.cart.reduce((a, l) => a + l.qty, 0);\n    const cartSum = s.cart.reduce((a, l) => a + l.price * l.qty, 0);\n\n    const shopVisible = SHOP.filter(p => s.filtro === \"todo\" || p.type === s.filtro);\n\n    return {\n      navItems: navDefs.map(n => ({\n        label: n.label,\n        bar: page === n.page || (n.page === \"blog\" && page === \"post\") ? \"100%\" : \"0%\",\n        go: this.go(n.page)\n      })),\n      goHome: this.go(\"inicio\"),\n      goSobre: this.go(\"sobre\"),\n      goServicios: this.go(\"servicios\"),\n      goBlog: this.go(\"blog\"),\n      goContacto: this.go(\"contacto\"),\n\n      isInicio: page === \"inicio\",\n      isSobre: page === \"sobre\",\n      isServicios: page === \"servicios\",\n      isTienda: page === \"tienda\" && tienda,\n      showTienda: tienda,\n      showTestis: testis,\n      cartIconDisplay: \"none\",\n      isBlog: page === \"blog\",\n      isPost: page === \"post\",\n      isContacto: page === \"contacto\",\n\n      beam: this.beamEl(),\n\n      pilares: [\n        {num:\"01 — VIDA\", title:\"Nutrición con propósito\", body:\"Planes de alimentación ajustados a tu rutina real, tus horarios y tus gustos — no una dieta genérica de plantilla.\"},\n        {num:\"02 — FUERZA\", title:\"Hipertrofia inteligente\", body:\"Entrenamiento progresivo enfocado en ganancia de masa muscular real, con seguimiento técnico continuo.\"},\n        {num:\"03 — RENDIMIENTO\", title:\"Rendimiento deportivo\", body:\"Periodización específica para tu disciplina, pensada para que rindas mejor, no solo para verte bien.\"}\n      ],\n      credenciales: [\n        {kind:\"LICENCIATURA\", name:\"Nutrición · UNIVA\"},\n        {kind:\"MAESTRÍA\", name:\"Nutrición Deportiva · UVM\"},\n        {kind:\"CERTIFICACIÓN\", name:\"Antropometrista Nivel 1 · ISAK\"},\n        {kind:\"CERTIFICACIÓN\", name:\"Entrenador Personal · NASM\"},\n        {kind:\"ESPECIALIDAD\", name:\"Preparación Deportiva · APEKS\"},\n        {kind:\"ESPECIALIDAD\", name:\"Programación para Glúteo · APEKS\"}\n      ],\n      testimonios: [\n        {quote:\"Llevaba dos años estancado. En cinco meses subí 6 kg de músculo y por primera vez entendí por qué comía lo que comía.\", who:\"DANIEL R., hipertrofia · 5 meses\"},\n        {quote:\"Nunca me pidió dejar mis comidas favoritas. Ajustamos porciones y horarios, y bajé 9 kg sin sentir que estaba a dieta.\", who:\"MARIANA T., nutrición · 4 meses\"},\n        {quote:\"Llegué a mi competencia en el mejor estado de mi carrera. La periodización cambió por completo mi temporada.\", who:\"ANDRÉS P., rendimiento · 1 temporada\"}\n      ],\n\n      posts: POSTS.map(p => ({\n        cat: p.cat, read: p.read, title: p.title, excerpt: p.excerpt,\n        open: () => this.setState({page: \"post\", postId: p.id})\n      })),\n      post: {\n        cat: post.cat, read: post.read, title: post.title, excerpt: post.excerpt,\n        body: post.body.map(b => ({h: b.h || \"\", p: b.p, hDisplay: b.h ? \"block\" : \"none\"}))\n      },\n\n      featured: SHOP.slice(0, 3).map(p => ({\n        tag: p.tag, name: p.name, desc: p.desc, slot: p.slot, cta: p.cta,\n        price: this.money(p.price), add: this.go(\"tienda\")\n      })),\n      shopVisible: shopVisible.map(p => ({\n        tag: p.tag, name: p.name, desc: p.desc, slot: p.slot,\n        cta: p.cta,\n        price: this.money(p.price), add: () => window.open(PROGRAM_LINKS[p.id], \"_blank\")\n      })),\n\n\n      planes: PLANES.map(p => ({\n        tag: p.tag, name: p.name, price: p.price, per: p.per, desc: p.desc, features: p.features,\n        badgeVis: p.popular ? \"visible\" : \"hidden\",\n        shadow: s.plan === p.id ? \"0 0 0 2px #111111\" : (p.popular ? \"0 8px 24px rgba(0,0,0,.08)\" : \"none\"),\n        select: () => this.setState({plan: p.id}),\n        pick: () => window.open(PLAN_LINKS[p.id], \"_blank\")\n      })),\n      pasos: [\n        {n:\"01\", title:\"Escribes y agendamos\", body:\"Llenas el formulario de contacto y coordinamos una llamada de 20 minutos, sin costo.\"},\n        {n:\"02\", title:\"Evaluación inicial\", body:\"Revisamos tu historial, tu rutina, tus horarios, medidas y objetivo real. De ahí sale el diagnóstico.\"},\n        {n:\"03\", title:\"Tu plan, en 72 horas\", body:\"Recibes plan de nutrición y programa de entrenamiento hechos para tu semana, con guía de compras.\"},\n        {n:\"04\", title:\"Ajustes y seguimiento\", body:\"Cada dos semanas revisamos datos y ajustamos. El plan evoluciona contigo, no al contrario.\"}\n      ],\n      faqs: FAQS.map((f, i) => ({\n        q: f.q, a: f.a,\n        sign: s.openFaq === i ? \"−\" : \"+\",\n        display: s.openFaq === i ? \"block\" : \"none\",\n        toggle: () => this.setState(st => ({openFaq: st.openFaq === i ? null : i}))\n      })),\n\n      contactos: [\n        {kind:\"WHATSAPP\", value:\"442 203 7838\"},\n        {kind:\"CORREO\", value:\"corbella.nutricion@gmail.com\"},\n        {kind:\"INSTAGRAM\", value:\"@corbella_balance\"},\n        {kind:\"TIKTOK\", value:\"@corbellabalance\"},\n        {kind:\"ATENCIÓN\", value:\"Querétaro presencial · en línea a todo México\"}\n      ],\n      sent: s.sent,\n      notSent: !s.sent,\n      sentName: s.sentName,\n      resetForm: this.resetForm,\n      submit: this.submit,\n      fields: FIELDS.map(f => {\n        const err = s.errors[f.id];\n        const border = err ? \"1px solid #444444\" : INPUT_STYLE.border;\n        const common = {\n          value: s.form[f.id],\n          onChange: this.setField(f.id),\n          style: {...INPUT_STYLE, border}\n        };\n        let control;\n        if (f.type === \"textarea\") {\n          control = h(\"textarea\", {...common, rows: 4, placeholder: f.ph, style: {...common.style, resize: \"vertical\", lineHeight: 1.55}});\n        } else if (f.type === \"select\") {\n          control = h(\"select\", common, f.options.map(o => h(\"option\", {key: o, value: o}, o)));\n        } else {\n          control = h(\"input\", {...common, type: f.type, placeholder: f.ph});\n        }\n        return {label: f.label, control, error: err || \"\", errDisplay: err ? \"block\" : \"none\"};\n      }),\n\n      cartCount: cartCount ? String(cartCount) : \"0\",\n      cartLines: s.cart.map(l => ({\n        name: l.name, qtyLabel: \"x\" + l.qty, price: this.money(l.price * l.qty),\n        remove: this.removeLine(l.id)\n      })),\n      cartTotal: this.money(cartSum),\n      cartDisplay: s.cartOpen ? \"flex\" : \"none\",\n      cartOverlay: s.cartOpen ? \"block\" : \"none\",\n      emptyCartDisplay: s.cart.length ? \"none\" : \"block\",\n      openCart: () => this.setState({cartOpen: true}),\n      closeCart: () => this.setState({cartOpen: false}),\n      checkoutLabel: s.cart.length ? \"Ir a pagar\" : \"Ver la tienda\",\n      checkout: s.cart.length ? () => this.setState({cartOpen: false}) : this.go(\"tienda\")\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
